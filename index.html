<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>这一程 旅行成片原型</title>
<style>:root{color-scheme:light}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>

<style>
/* Layout: presentation stage. Flow rail (left) · phone prototype (center) · design notes (right). Stacks to one column on narrow screens. */
:root{
  --bg:#EBF0F4; --surface:#FFFFFF; --sunk:#F3F6F9; --ink:#18222D; --muted:#5B6878; --line:#D3DCE4;
  --accent:#D47E26; --accent-ink:#9A5512; --accent-soft:#FBEBD9;
  --night:#1E3247; --night-ink:#EAF1F7;
  --ok:#2F7D5B; --warn:#B4541E; --warn-soft:#FBE6DA;
  --f-display:"Noto Serif SC","Songti SC","STSong",serif;
  --f-body:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E141A; --surface:#17202A; --sunk:#111922; --ink:#E4EBF1; --muted:#93A2B2; --line:#2A3743;
  --accent:#E79A4A; --accent-ink:#F2B677; --accent-soft:#3A2814;
  --night:#0B1622; --night-ink:#E4EBF1; --ok:#5DBB8F; --warn:#F09A6A; --warn-soft:#3B2216; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E141A; --surface:#17202A; --sunk:#111922; --ink:#E4EBF1; --muted:#93A2B2; --line:#2A3743;
  --accent:#E79A4A; --accent-ink:#F2B677; --accent-soft:#3A2814;
  --night:#0B1622; --night-ink:#E4EBF1; --ok:#5DBB8F; --warn:#F09A6A; --warn-soft:#3B2216; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 40px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{max-width:1240px;margin:0 auto 20px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between}
.top h1{font-family:var(--f-display);font-size:26px;margin:0;letter-spacing:.02em;text-wrap:balance}
.top p{margin:0;color:var(--muted);font-size:13px;max-width:60ch}
.badge{font-size:11px;letter-spacing:.08em;color:var(--accent-ink);background:var(--accent-soft);padding:2px 8px;border-radius:4px;white-space:nowrap}
.stage{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:230px minmax(0,390px) minmax(0,1fr);gap:28px;align-items:start}
.rail,.notes{min-width:0}
.rail h2,.notes h2{font-size:11px;letter-spacing:.12em;color:var(--muted);font-weight:500;margin:0 0 10px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.steps button{width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:6px;display:flex;gap:10px;align-items:center;color:var(--muted)}
.steps button .n{font-family:var(--f-mono);font-size:12px;width:22px}
.steps li.sub button{padding-left:22px;font-size:13px}
.steps button[aria-current="step"]{background:var(--surface);color:var(--ink);font-weight:500;box-shadow:0 0 0 1px var(--line)}
.steps button[aria-current="step"] .n{color:var(--accent-ink)}
.cases{margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.cases label{display:flex;gap:8px;align-items:center;padding:5px 2px;font-size:13px;cursor:pointer}
.cases .hint{font-size:12px;color:var(--muted);margin:6px 0 0}

/* phone */
.whois{text-align:center;font-size:12px;color:var(--muted);margin:0 0 8px}
.whois b{color:var(--ink);font-weight:500}
.whois.friend b{color:var(--accent-ink)}
.phone{width:100%;max-width:390px;margin:0 auto;aspect-ratio:390/800;max-height:820px;border-radius:40px;background:var(--night);padding:10px;box-shadow:0 20px 50px -24px rgba(20,40,60,.45);transition:background .3s}
.phone.friend{background:#5a4a3c}
.screen{position:relative;height:100%;border-radius:31px;overflow:hidden;background:var(--sunk);display:flex;flex-direction:column}
.status{height:34px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.view{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 16px 20px;display:flex;flex-direction:column;gap:12px}
.screen.night{background:#0b1220} .screen.night .status{color:#c9d6e2}
.appbar{display:flex;align-items:center;gap:8px;min-height:36px}
.appbar .back{background:none;border:0;padding:4px 6px;margin-left:-6px;color:var(--muted);font-size:18px;line-height:1}
.appbar h3{margin:0;font-size:16px;font-weight:700;flex:1}
.appbar .small{font-size:12px;color:var(--muted)}
.card{background:var(--surface);border-radius:14px;padding:14px;border:1px solid var(--line)}
.muted{color:var(--muted)} .mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.btn{border:0;border-radius:12px;padding:12px 14px;font-weight:500;background:var(--accent);color:#fff;width:100%}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.soft{background:var(--accent-soft);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.chip{font-size:11px;padding:1px 7px;border-radius:999px;background:var(--sunk);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.chip.src{background:var(--accent-soft);color:var(--accent-ink);border-color:transparent}
.sticky-cta{position:sticky;bottom:-20px;margin:0 -16px -20px;padding:12px 16px 16px;background:linear-gradient(to top,var(--sunk) 78%,transparent);display:flex;flex-direction:column;gap:8px;z-index:2}
.im{background-size:cover;background-position:center}

/* lock screen */
.lock{position:relative;flex:1;display:flex;flex-direction:column;padding:10px 14px 18px;gap:10px;color:#EEF3F8}
.lock .lockbg{position:absolute;inset:0}
.lock .lockbg::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(8,14,26,.25),rgba(8,14,26,.6))}
.lock > *:not(.lockbg){position:relative}
.lock .clock{text-align:center;font-family:var(--f-mono);font-size:56px;margin-top:30px;letter-spacing:.02em}
.lock .date{text-align:center;font-size:14px;opacity:.85;margin-top:-8px}
.notif{margin-top:auto;background:rgba(255,255,255,.16);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.22);border-radius:16px;padding:12px 14px;text-align:left;color:#EEF3F8;width:100%}
.notif .h{display:flex;justify-content:space-between;font-size:11px;opacity:.8;margin-bottom:4px}
.notif b{display:block;font-size:14px;margin-bottom:2px}
.notif span{font-size:13px;opacity:.92}
.lock .alt{font-size:12px;opacity:.8;text-align:center}
.lock .alt button{background:none;border:0;text-decoration:underline;color:inherit;padding:0}

/* thumbs */
.thumb{position:relative;border-radius:10px;overflow:hidden;aspect-ratio:3/4;background:#8aa;border:2px solid transparent;padding:0;display:block;width:100%}
.thumb .img{position:absolute;inset:0}
.thumb .cap{position:absolute;left:0;right:0;bottom:0;padding:16px 6px 5px;font-size:10px;line-height:1.3;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.6));text-align:left}
.thumb .who{position:absolute;top:4px;left:4px;font-size:9px;color:#fff;background:rgba(0,0,0,.4);padding:0 5px;border-radius:4px}
.thumb .dur{position:absolute;top:4px;right:4px;font-size:9px;color:#fff;background:rgba(0,0,0,.4);padding:0 4px;border-radius:4px}
.thumb .ok{position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;display:grid;place-items:center}
.thumb.on{border-color:var(--accent)}
.thumb.on .dur{display:none}
.thumb .lbl{position:absolute;left:4px;top:4px;font-size:10px;color:#fff;background:rgba(0,0,0,.55);padding:0 6px;border-radius:4px}
.thumb .lbl.keep{background:var(--ok)}
.thumbs{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:6px}
.t-dark{filter:brightness(.32)} .t-shake{filter:blur(2.2px);transform:rotate(-4deg) scale(1.12)} .t-dup{opacity:.55}

/* story */
.sbar{position:sticky;top:-4px;z-index:3;margin:0 -16px;padding:6px 16px 8px;background:var(--sunk)}
.sbar .card{padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.segs{display:flex;gap:3px;height:34px}
.seg-i{min-width:0;flex:1;border-radius:6px;background:var(--accent-soft);color:var(--accent-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;font-size:11px;transition:flex .35s ease}
.seg-i small{font-size:10px;opacity:.85}
.seg-i.keep{background:var(--accent);color:#fff}
.seg-i.q{background:transparent;border:1.5px dashed var(--accent)}
.chap{display:flex;flex-direction:column;gap:10px;transition:box-shadow .3s}
.chap.removed{opacity:.55}
.chap.flash{box-shadow:0 0 0 2px var(--accent)}
.chap .head{display:flex;gap:10px;align-items:flex-start}
.chap .idx{font-family:var(--f-mono);font-size:12px;color:var(--accent-ink);padding-top:2px}
.chap .t{font-weight:700;font-size:15px}
.chap .w{font-size:12px;color:var(--muted)}
.why{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.why b{color:var(--ink);font-weight:500}
details.more{font-size:12px;color:var(--muted)}
details.more summary{cursor:pointer;color:var(--accent-ink);list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"▸ "} details.more[open] summary::before{content:"▾ "}
details.more ul{margin:6px 0 0;padding-left:16px;display:flex;flex-direction:column;gap:3px}
details.how{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12px;color:var(--muted)}
details.how summary{cursor:pointer;color:var(--ink);font-weight:500;font-size:13px}
details.how ol{margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.act{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 9px;font-size:12px}
.act[aria-pressed="true"]{background:var(--accent-soft);border-color:transparent;color:var(--accent-ink)}
.note-in{width:100%;border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:7px 9px;font:inherit;font-size:13px;color:var(--ink)}
.pv{font-size:11px;color:var(--muted);margin-top:-4px}
.pv.has{color:var(--accent-ink)}
.ask{background:var(--accent-soft);border-radius:10px;padding:10px;font-size:13px;color:var(--accent-ink)}
.suggest{font-size:12px;background:var(--sunk);border-radius:8px;padding:8px 10px;color:var(--muted)}
.lenseg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.lenseg button{flex:1;border:0;background:none;border-radius:7px;padding:6px 4px;font-size:12px;color:var(--muted)}
.lenseg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.pend{font-size:12px;color:var(--accent-ink);text-align:center}

/* organize */
.prog{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.prog li{display:flex;gap:10px;align-items:flex-start;font-size:13px}
.prog .dot{width:18px;height:18px;flex:none;border-radius:50%;border:2px solid var(--line);margin-top:1px;display:grid;place-items:center;font-size:10px}
.prog li.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.prog li.run .dot{border-color:var(--accent);border-top-color:transparent;animation:spin 1s linear infinite}
.prog li.fail .dot{background:var(--warn);border-color:var(--warn);color:#fff}
.prog li .c{color:var(--muted);font-size:12px}
@keyframes spin{to{transform:rotate(360deg)}}
.mini{display:flex;gap:10px;align-items:center;padding:8px;border-radius:10px;background:var(--surface);border:1px solid var(--line);animation:rise .4s ease both}
.mini .sw{width:40px;height:52px;border-radius:6px;flex:none}
.mini.skel .sw,.mini.skel .ln{background:var(--line);animation:pulse 1.2s ease-in-out infinite}
.mini .ln{height:10px;border-radius:4px}
@keyframes rise{from{transform:translateY(6px);opacity:.4}to{transform:none;opacity:1}}
@keyframes pulse{50%{opacity:.5}}
.err{background:var(--warn-soft);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;font-size:13px}
.err b{color:var(--warn)}
.dedup{display:flex;flex-direction:column;gap:8px;animation:rise .4s ease both}

/* player */
.player{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:3/4;background:#223;color:#fff;flex:none}
.player .scene{position:absolute;inset:0}
.player .scene.kb{animation:kb var(--d,1.6s) linear both}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.09)}}
.player .shade{position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.25),transparent 30%,transparent 60%,rgba(0,0,0,.5))}
.player .ch{position:absolute;top:10px;left:12px;font-size:11px;letter-spacing:.06em;opacity:.9;font-family:var(--f-mono)}
.player .chg{position:absolute;top:30px;left:12px;font-size:11px;background:var(--accent);color:#fff;padding:0 7px;border-radius:4px}
.player .sub{position:absolute;left:14px;right:14px;bottom:44px;font-size:15px;text-align:center;text-shadow:0 1px 4px rgba(0,0,0,.7);font-weight:500}
.player .title{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:28px;text-shadow:0 2px 10px rgba(0,0,0,.5);transition:opacity .4s}
.player .bar{position:absolute;left:12px;right:12px;bottom:12px;display:flex;gap:3px;align-items:center}
.player .bar i{height:3px;background:rgba(255,255,255,.35);border-radius:2px;overflow:hidden;position:relative}
.player .bar i b{position:absolute;inset:0;background:#fff;transform-origin:left;transform:scaleX(0)}
.player .bar i.c{height:5px;background:rgba(240,160,80,.55)} .player .bar i.c b{background:#F2A65A}
.player .pp{position:absolute;right:10px;top:8px;background:rgba(0,0,0,.4);border:0;color:#fff;border-radius:999px;padding:3px 10px;font-size:12px}
.vbanner{background:var(--accent-soft);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:13px;display:flex;flex-direction:column;gap:6px}
.vbanner .vt{display:flex;justify-content:space-between;align-items:center;gap:8px}
.vbanner b{color:var(--accent-ink)}
.fb{display:flex;flex-wrap:wrap;gap:6px}
.fb button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:2px}
.tile b{font-size:13px} .tile span{font-size:11px;color:var(--muted)}

/* friend */
.chat{display:flex;flex-direction:column;gap:10px;padding-top:6px}
.bub{max-width:80%;padding:8px 11px;border-radius:12px;font-size:13px;background:var(--surface);border:1px solid var(--line)}
.bub.me{align-self:flex-end;background:var(--accent-soft);border-color:transparent}
.linkcard{align-self:flex-start;width:82%;display:flex;gap:10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.linkcard .lc{width:52px;height:66px;border-radius:8px;flex:none}
.linkcard b{display:block;font-size:13px;line-height:1.4}
.linkcard span{font-size:11px;color:var(--muted)}
.urlbar{font-size:11px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px 10px;text-align:center}
.fday{font-size:12px;color:var(--muted);margin-bottom:4px}
.fgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.fitem{position:relative;aspect-ratio:1;border:0;padding:0;border-radius:6px;overflow:hidden}
.fitem .ck{position:absolute;top:3px;right:3px;width:17px;height:17px;border-radius:50%;border:1.5px solid #fff;background:rgba(0,0,0,.25);font-size:10px;color:#fff;display:grid;place-items:center}
.fitem.on .ck{background:var(--accent);border-color:var(--accent)}
.fitem.off .ck{opacity:.9}
.fitem.off::before{content:"";position:absolute;inset:0;background:rgba(255,255,255,.45)}
.fitem .vt{position:absolute;left:4px;bottom:2px;font-size:9px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.fitem .ex{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);color:#fff;font-size:9px;text-align:center;line-height:1.6}
.upbar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.upbar i{display:block;height:100%;width:0;background:var(--accent);transition:width 1.4s ease}
.bigok{width:56px;height:56px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:26px;margin:0 auto}

/* v3: chapters, multi-select, effects */
.filmrow{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.film-in,.title-in{flex:1;min-width:0;border:0;border-bottom:1px dashed transparent;background:transparent;font:inherit;color:var(--ink);padding:1px 0}
.film-in{font-family:var(--f-display);font-size:17px;font-weight:700}
.title-in{font-weight:700;font-size:15px}
.film-in:hover,.title-in:hover,.film-in:focus,.title-in:focus{border-bottom-color:var(--accent);outline:none}
.trow{display:flex;align-items:center;gap:4px}
.pen{font-size:12px;color:var(--muted)}
.thumb .ord{position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;font-family:var(--f-mono);display:grid;place-items:center}
.addch{border:1.5px dashed var(--accent);background:transparent;color:var(--accent-ink);border-radius:14px;padding:12px;font-weight:500}
.hint{font-size:12px;color:var(--muted)}
.act:disabled{opacity:.4;cursor:default}
.pool{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pool .thumb .from{position:absolute;left:0;right:0;top:0;padding:3px 5px 10px;font-size:9px;color:#fff;background:linear-gradient(rgba(0,0,0,.55),transparent);text-align:left}
.player .layers{position:absolute;inset:0;overflow:hidden}
.player .slot{position:absolute;inset:0;overflow:hidden}
.player .slot .img{position:absolute;inset:0}
.img.mv-push{animation:kb var(--d,1.6s) linear both}
.img.mv-pan{animation:pan var(--d,1.6s) linear both}
@keyframes pan{from{transform:scale(1.16) translateX(-5%)}to{transform:scale(1.16) translateX(5%)}}
.slot.frozen::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 7px rgba(255,255,255,.9);animation:frz .45s ease both}
@keyframes frz{from{background:rgba(255,255,255,.55)}to{background:transparent}}
.ovl{position:absolute;inset:0;pointer-events:none}
.ov-snow{background-image:var(--snowtex);background-size:120px 120px;animation:fall 3s linear infinite}
@keyframes fall{from{background-position:0 0}to{background-position:-24px 120px}}
.ov-bokeh{background:radial-gradient(circle at 18% 30%,rgba(255,200,120,.4) 0 6%,transparent 7%),radial-gradient(circle at 72% 22%,rgba(255,220,150,.35) 0 8%,transparent 9%),radial-gradient(circle at 55% 62%,rgba(255,190,110,.3) 0 5%,transparent 6%),radial-gradient(circle at 30% 75%,rgba(255,230,170,.25) 0 7%,transparent 8%);animation:bok 2.6s ease-in-out infinite alternate}
@keyframes bok{to{opacity:.45;transform:scale(1.08)}}
.veil{position:absolute;inset:0;opacity:0;pointer-events:none}
.veil.go{animation:veil .6s ease both}
@keyframes veil{0%{opacity:0}45%{opacity:1}100%{opacity:0}}
.grain{position:absolute;inset:0;background-image:var(--grain);opacity:.22;mix-blend-mode:overlay;animation:grain .35s steps(2) infinite;pointer-events:none}
@keyframes grain{50%{background-position:30px 20px}}
.player .fxtag{position:absolute;right:10px;top:36px;font-size:10px;background:rgba(0,0,0,.5);padding:1px 7px;border-radius:4px}
.player .fxtag:empty{display:none}
.player.mini{aspect-ratio:4/3}
.player.mini .sub{bottom:16px}
.fxsum{display:flex;gap:12px;align-items:center}
.fxsum .btn{width:auto;flex:none;padding:8px 14px}
.trrow{display:flex;align-items:center;gap:8px;border:0;background:none;padding:2px 4px;font-size:12px;color:var(--muted);text-align:left}
.trrow b{color:var(--ink);font-weight:500}
.trrow .ln{width:2px;height:20px;background:var(--line);margin:0 10px 0 22px}
.aitag{font-size:10px;padding:0 6px;border-radius:4px;background:var(--accent-soft);color:var(--accent-ink)}
.mine{font-size:10px;padding:0 6px;border-radius:4px;background:var(--ink);color:var(--surface)}
.fxrow{display:flex;gap:10px;padding:10px;align-items:flex-start}
.fxrow.focus{box-shadow:0 0 0 2px var(--accent)}
.fxthumb{width:48px;height:64px;border-radius:8px;border:0;padding:0;flex:none}
.fxchip{border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:2px 9px;font-size:11px}
.fxchip.changed{border-color:var(--ink)}
.optrow{display:flex;flex-wrap:wrap;gap:6px}
.optrow button{border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:5px 10px;font-size:12px}
.optrow button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}

/* sheet & toast */
.scrim{position:absolute;inset:0;background:rgba(10,20,30,.4);display:flex;align-items:flex-end;z-index:5}
.sheet{width:100%;background:var(--surface);border-radius:18px 18px 0 0;padding:16px 16px 22px;display:flex;flex-direction:column;gap:10px;max-height:80%;overflow:auto;animation:up .25s ease both}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.sheet h4{margin:0;font-size:15px}
.opt{border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px;width:100%}
.opt span{font-size:12px;color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.toast{position:absolute;left:16px;right:16px;bottom:20px;background:var(--ink);color:var(--surface);border-radius:10px;padding:10px 12px;font-size:13px;z-index:6;animation:up .25s ease both}

/* notes */
.notes .card{padding:18px 20px}
.notes h3{font-family:var(--f-display);font-size:20px;margin:0 0 4px;text-wrap:balance}
.notes .sub{color:var(--muted);font-size:13px;margin:0 0 14px}
.notes h4{font-size:12px;letter-spacing:.08em;color:var(--accent-ink);margin:14px 0 6px;font-weight:500}
.notes ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.notes li{max-width:60ch}
.notes .foot{margin-top:14px;font-size:12px;color:var(--muted)}

@media (max-width:1060px){
  .stage{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .rail{grid-column:1/-1}
  .steps{flex-direction:row;overflow-x:auto;padding-bottom:4px}
  .steps button{white-space:nowrap}
  .steps li.sub button{padding-left:10px}
  .cases{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;margin-top:12px;padding-top:10px}
  .cases h2{width:100%;margin-bottom:0}
}
@media (max-width:720px){
  .stage{grid-template-columns:minmax(0,1fr)}
  .phone{aspect-ratio:auto;height:760px;max-height:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

    bars.forEach((b,j)=>b.style.transform="scaleX("+(j<it.chi?1:0)+")");start=performance.now()}
  const iv=setInterval(()=>{if(!playing||i<0||!document.getElementById("player"))return;const it=seq[i],p=(performance.now()-start)/it.dur;
    if(bars[it.chi])bars[it.chi].style.transform="scaleX("+Math.min(1,(it.j+Math.min(1,p))/it.n)+")";

  timers.push(iv);
  if(opt.mini)show(0);else{slots[0].firstElementChild.className="img im im-"+clip(seq[0].cid).k;later(()=>show(0),1100)}
  ctl={toggle(){if(!playing&&i===seq.length-1){clearTimers();runPlayer(seq,opt);return"暂停"}playing=!playing;if(!playing)pausedAt=performance.now();else start+=performance.now()-pausedAt;return playing?"暂停":"播放"}}}

 later(()=>{S.step=2;render();let i=0;const tick=()=>{if(S.screen!=="organize")return;
   if(S.case==="net"&&!S.netUsePartial&&!S.retried&&i===3){S.netFailed=true;render();return}
   i++;S.shown=i;render();if(i<list.length)later(tick,550);else later(()=>{S.step=3;render();later(()=>{S.step=4;S.organizeDone=true;render()},700)},500)};later(tick,500)},1500)}
function runMake(){const partial=S.versions.length>0,dt=partial?420:800;S.mk=0;render();
 later(()=>{S.mk=1;render()},dt);later(()=>{S.mk=2;render()},dt*2);later(()=>{S.mk=3;render();later(commitAndShow,350)},dt*3)}
function commitAndShow(){const sn=snap(),last=S.versions[S.versions.length-1];
 if(last){const d=diff(last,sn);if(!d.parts.length){go("result");toast("没有改动，还是第 "+S.versions.length+" 版");return}S.diff=d}else S.diff=null;
 S.versions.push(sn);go("result")}
function runUpload(){later(()=>{const b=$("#upbar");if(b)b.style.width="100%"},60);later(()=>go("f-done"),1700)}

function applyMode(m){S.mode=m;S.ch.forEach(c=>c.auto=null);
 if(m==="只讲人")orderIds().forEach(id=>{const c=st(id);if(c.pick||c.keep||base(id).custom)return;const cur=selOf(id);if(cur.length&&!cur.some(x=>clip(x).people)){const p=avail(id).find(x=>x.tags.includes("你们俩同框"))||avail(id).find(x=>x.people);if(p)c.auto=[p.id]}})}
function fillUncertain(){S.ch.forEach(c=>{if(base(c.id).uncertain&&!selOf(c.id).length)c.pick=["3c"]})}
function openNew(){S.nc={name:"",sel:[]};S.sheet="newch";renderOverlay()}

/* events */
document.addEventListener("click",e=>{
 const g=e.target.closest("[data-go]");
 if(g){const to=g.dataset.go;if(g.closest("#steps")&&["make","result","tune","done"].includes(to))fillUncertain();S.flash=null;go(to);return}
 const a=e.target.closest("[data-act]");if(!a)return;
 if(a.classList.contains("scrim")&&e.target!==a)return;
 const act=a.dataset.act,id=+a.dataset.id,c=id?st(id):null;
 switch(act){
  case "toast":toast(a.dataset.v);break;
  case "thinMake":S.len=15;go("make");break;
  case "ftog":{const i=+a.dataset.i;S.fr[i]=!S.fr[i];keepScroll(render);break}
  case "backZhou":{const fc=friendCounts();S.invited=true;S.frV=fc.v;S.frP=fc.p;go("trip");toast("小林补充了 "+fc.v+" 段视频、"+fc.p+" 张照片");break}
  case "retry":S.retried=true;S.netFailed=false;render();{let i=3;const list=activeIds().filter(x=>x<100);const tick=()=>{i++;S.shown=i;render();if(i<list.length)later(tick,500);else later(()=>{S.step=4;S.organizeDone=true;render()},600)};later(tick,600)}break;
  case "partial":S.netUsePartial=true;go("story");break;
  case "pick":{const arr=(c.pick||selOf(id)).slice(),cid=a.dataset.c,k=arr.indexOf(cid);if(k>=0)arr.splice(k,1);else arr.push(cid);c.pick=arr;c.auto=null;keepScroll(render);break}
  case "keep":c.keep=!c.keep;keepScroll(render);if(c.keep)toast(t(id)+"设为必留，多分了一点时长");break;
  case "mv":{const list=activeIds(),i=list.indexOf(id),j=i+(+a.dataset.d);if(j<0||j>=list.length)break;const x=S.order.indexOf(list[i]),y=S.order.indexOf(list[j]);S.order[x]=list[j];S.order[y]=list[i];
    render();const el=document.getElementById("chap-"+id);if(el){el.scrollIntoView({block:"center"});el.classList.add("flash");setTimeout(()=>el.classList.remove("flash"),900)}break}
  case "remove":{if(c.keep){toast("这一章设了必留，先取消必留再去掉");break}const before=orderIds().length,L=length();c.removed=true;keepScroll(render);
    if(before>1)toast("去掉了"+t(id)+"，其余每章多约 "+Math.max(1,Math.round(L/(before-1)-L/before))+" 秒");break}
  case "restore":c.removed=false;keepScroll(render);break;
  case "len":S.len=+a.dataset.v;keepScroll(render);break;
  case "newch":openNew();break;
  case "ncTog":{const cid=a.dataset.c,k=S.nc.sel.indexOf(cid);if(k>=0)S.nc.sel.splice(k,1);else S.nc.sel.push(cid);const sh=document.querySelector(".sheet"),y=sh?sh.scrollTop:0;renderOverlay();const s2=document.querySelector(".sheet");if(s2)s2.scrollTop=y;break}
  case "ncAdd":{const nid=101+S.custom.length,name=(S.nc.name||"").trim()||"新的一章";S.custom.push({id:nid,title:name,when:"你加的一章",count:S.nc.sel.length,custom:true,cands:S.nc.sel.map(x=>({id:x}))});
    S.ch.push(chState(nid));S.order.push(nid);S.sheet=null;S.flash=nid;go("story");toast("加在了最后，可以用“上移”挪到合适的位置");later(()=>{S.flash=null},2500);break}
  case "pp":if(ctl)a.textContent=ctl.toggle();break;
  case "fb":S.sheet=a.dataset.v;renderOverlay();break;
  case "closeSheet":{const was=S.sheet;S.sheet=null;renderOverlay();if(was==="fx"&&S.screen==="tune"){keepScroll(render);clearTimers();tunePreview()}break}
  case "missTo":S.flash=id;go("story");toast("在这一章多选一段，或设为必留");later(()=>{S.flash=null;const el=document.getElementById("chap-"+id);if(el)el.classList.remove("flash")},3000);break;
  case "missNew":go("story");later(()=>{const b=$("#addch");if(b)b.scrollIntoView({block:"center"});openNew()},100);break;
  case "setPace":S.pace=a.dataset.v;go("make");break;
  case "setMusic":S.music=a.dataset.v;go("make");break;
  case "setMode":applyMode(a.dataset.v);go("make");break;
  case "applySub":go("make");break;
  case "focus":S.tuneFocus=id;keepScroll(render);clearTimers();tunePreview();break;
  case "trSheet":S.tuneFocus=id;S.sheet="tr";S.sheetId=id;keepScroll(render);clearTimers();tunePreview();break;
  case "fxSheet":S.tuneFocus=id;S.sheet="fx";S.sheetId=id;keepScroll(render);clearTimers();tunePreview();break;
  case "setTr":case "setFx":{const sid=S.sheetId,cc=st(sid),g=act==="setTr"?"tr":a.dataset.g,v=a.dataset.v,ai=aiFx(sid);cc.fx=Object.assign({},cc.fx||{});if(ai[g]===v)delete cc.fx[g];else cc.fx[g]=v;if(!Object.keys(cc.fx).length)cc.fx=null;
    if(act==="setTr")S.sheet=null;keepScroll(render);clearTimers();tunePreview();break}
  case "setFilter":S.filter=a.dataset.v===AI_FILTER?null:a.dataset.v;keepScroll(render);clearTimers();tunePreview();break;
  case "fxReset":S.ch.forEach(x=>x.fx=null);S.filter=null;keepScroll(render);clearTimers();tunePreview();toast("全部改回 AI 建议");break;
  case "applyFx":go("make");break;
  case "revert":{S.versions.pop();const p=S.versions[S.versions.length-1],r=JSON.parse(JSON.stringify(p.raw));Object.assign(S,{ch:r.ch,order:r.order,custom:r.custom,len:r.len,pace:r.pace,music:r.music,mode:r.mode,filter:r.filter,film:r.film});
    S.diff=S.versions.length>1?diff(S.versions[S.versions.length-2],p):null;go("result");toast("已回到第 "+S.versions.length+" 版");break}
  case "export":S.exported=a.dataset.v;go("done");break;
  case "short":S.len=15;go("make");break;
  case "restart":setCase(S.case,true);break;
  case "demoNet":S.case=S.case==="net"?"normal":"net";S.netFailed=false;S.retried=false;S.netUsePartial=false;document.querySelectorAll('input[name="case"]').forEach(r=>r.checked=r.value==="normal");go("organize");break;
 }
});
document.addEventListener("input",e=>{const el=e.target,act=el.dataset.act;if(!act)return;
 if(act==="ncName"){S.nc.name=el.value;return}
 if(act==="film"){S.film=el.value}
 else{const c=st(+el.dataset.id);if(!c)return;
   if(act==="note"){c.note=el.value;const pv=document.getElementById("pv-"+c.id);if(pv){pv.textContent=c.note?"字幕会显示：「"+c.note+"」":"不写的话，字幕用片段描述";pv.classList.toggle("has",!!c.note)}}
   if(act==="rename"){const v=el.value.trim();c.title=v&&v!==base(c.id).title?v:null;if(base(c.id).custom&&v){base(c.id).title=v;c.title=null}}}
 const pd=document.getElementById("pend");if(pd)pd.textContent=pendingText()});
document.addEventListener("change",e=>{if(e.target.id==="photos")S.photos=e.target.checked;if(e.target.name==="case")setCase(e.target.value)});
function setCase(v,restart){clearTimers();S=fresh(v);document.querySelectorAll('input[name="case"]').forEach(r=>r.checked=r.value===v);
 go(restart?"entry":v==="net"?"organize":"entry");if(v==="thin"&&!restart)toast("素材很少：先看提醒文案的变化，再点进去")}
function fromHash(){const h=location.hash.slice(1);if(N[h]&&h!==S.screen){if(["make","result","tune","done"].includes(h))fillUncertain();go(h)}}
window.addEventListener("hashchange",fromHash);
render();if(location.hash)fromHash();
})();
</script>
